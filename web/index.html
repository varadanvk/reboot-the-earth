<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forest Data Coverage</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><path d=%22M8 1 3 9h3l-2 4h8l-2-4h3z%22 fill=%22%23256abf%22/></svg>">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script><!-- must precede deck.gl: its H3 layers use the global -->
<script src="https://unpkg.com/deck.gl@9.1.14/dist.min.js"></script>
<style>
:root {
  color-scheme: light;
  --surface-0: #f3f2ee; --surface-1: #fcfcfb; --surface-2: #ffffff;
  --border: #dcdad3; --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7973;
  --accent: #256abf;
  --k-field_plot: #eb6834; --k-drone_imagery: #1baf7a; --k-airborne_lidar: #eda100;
  --k-spaceborne_lidar: #e87ba4; --k-fuel_treatment: #008300; --k-fire_perimeter: #6250d6;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #232321;
    --border: #3a3936; --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --accent: #5598e7;
    --k-field_plot: #d95926; --k-drone_imagery: #199e70; --k-airborne_lidar: #c98500;
    --k-spaceborne_lidar: #d55181; --k-fuel_treatment: #008300; --k-fire_perimeter: #9085e9;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #232321;
  --border: #3a3936; --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --accent: #5598e7;
  --k-field_plot: #d95926; --k-drone_imagery: #199e70; --k-airborne_lidar: #c98500;
  --k-spaceborne_lidar: #d55181; --k-fuel_treatment: #008300; --k-fire_perimeter: #9085e9;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--surface-0); color: var(--text-primary);
  font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
#app { display: grid; grid-template-columns: 330px 1fr; height: 100%; }
#side { background: var(--surface-1); border-right: 1px solid var(--border); overflow-y: auto; padding: 16px; }
#mapwrap { position: relative; min-height: 0; }
#map { position: absolute; inset: 0; }
h1 { font-size: 16px; margin: 0 0 2px; }
.sub { color: var(--text-secondary); margin: 0 0 14px; }
h2 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); margin: 18px 0 8px; font-weight: 600; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button, .chip { border: 1px solid var(--border); background: var(--surface-2); color: var(--text-primary);
  border-radius: 6px; padding: 4px 8px; font: inherit; cursor: pointer; }
.seg button[aria-pressed="true"], .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.kind { display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
.kind input { margin: 0; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
.sw.outline { background: transparent !important; border: 2px solid; }
.sw.dash { background: transparent !important; border: 2px dashed; }
.count { color: var(--text-muted); font-variant-numeric: tabular-nums; }
.sim { font-size: 10px; color: var(--text-muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; margin-left: 4px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.legend-bar { height: 10px; border-radius: 3px; margin: 6px 0 2px; }
.legend-labels { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 11px; }
#panel { position: absolute; top: 12px; right: 12px; width: 340px; max-height: calc(100% - 24px); overflow-y: auto;
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px;
  box-shadow: 0 4px 20px rgba(0,0,0,.15); display: none; z-index: 10; }
#panel.open { display: block; }
#panel .close { position: absolute; top: 8px; right: 10px; border: 0; background: none; color: var(--text-muted); font-size: 18px; cursor: pointer; }
#panel h3 { margin: 0 24px 4px 0; font-size: 14px; }
#panel img { width: 100%; border-radius: 6px; margin: 8px 0; background: var(--surface-0); min-height: 60px; }
dl { display: grid; grid-template-columns: 110px 1fr; gap: 3px 8px; margin: 8px 0; }
dt { color: var(--text-muted); } dd { margin: 0; overflow-wrap: anywhere; }
.tag { display: inline-block; border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; margin: 1px 2px 1px 0; font-size: 11px; }
.near { list-style: none; padding: 0; margin: 4px 0; }
.near li { padding: 5px 0; border-top: 1px solid var(--border); cursor: pointer; }
.near li:hover { color: var(--accent); }
table.kinds { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.kinds td, table.kinds th { padding: 4px 4px; border-top: 1px solid var(--border); text-align: left; vertical-align: top; }
table.kinds th { color: var(--text-muted); font-weight: 500; font-size: 11px; }
.muted { color: var(--text-muted); }
.status { position: absolute; left: 12px; bottom: 12px; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 8px; color: var(--text-secondary); z-index: 10; font-size: 12px; }
.deck-tooltip { font: 12px/1.4 ui-sans-serif, system-ui, sans-serif !important; border-radius: 6px !important;
  background: var(--surface-2) !important; color: var(--text-primary) !important; border: 1px solid var(--border); }
@media (max-width: 760px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 55% 45%; }
  #side { order: 2; border-right: 0; border-top: 1px solid var(--border); }
  #panel { width: auto; left: 12px; }
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <h1>Forest data coverage</h1>
    <p class="sub">How much forest data exists for each patch of California. Click a hexagon for a breakdown; zoom in to see individual footprints.</p>

    <h2>Colour by</h2>
    <div class="seg" id="metric"></div>
    <div class="legend-bar" id="legend-bar"></div>
    <div class="legend-labels"><span id="legend-lo"></span><span id="legend-hi"></span></div>

    <h2>Data kinds</h2>
    <div id="kinds"></div>

    <h2>I need data that can measure…</h2>
    <div class="seg" id="caps"></div>

    <h2>Filters</h2>
    <div class="row"><span>Data from <b id="year-val"></b> or newer</span></div>
    <input type="range" id="year" min="1950" max="2026" step="1">
    <label class="row"><span>Commercial use allowed</span><input type="checkbox" id="commercial"></label>
    <label class="row"><span>Include simulated sources</span><input type="checkbox" id="showsim" checked></label>
    <p class="muted" id="footer" style="margin-top:18px"></p>
  </aside>
  <main id="mapwrap">
    <div id="map"></div>
    <div id="panel"><button class="close" aria-label="Close">×</button><div id="panel-body"></div></div>
    <div class="status" id="status">Loading…</div>
  </main>
</div>
<script>
// object order = draw order for footprints (big envelopes first, small things on top).
// weight = how much one kind adds to the coverage score: ground truth counts fully, wall-to-wall
// layers (3DEP covers 97% of CA) count less so they don't saturate the map.
const KINDS = {
  airborne_lidar:   { label: "Airborne lidar (3DEP)", style: "dash",    weight: 0.5 },
  spaceborne_lidar: { label: "GEDI (spaceborne)",     style: "outline", weight: 0.25 },
  fire_perimeter:   { label: "Fire perimeters",       style: "outline", weight: 0.3 },
  fuel_treatment:   { label: "Fuel treatments",       style: "fill",    weight: 0.5 },
  drone_imagery:    { label: "Drone imagery",         style: "fill",    weight: 1 },
  field_plot:       { label: "Field plots",           style: "fill",    weight: 1 },
};
const CAP_LABELS = {
  tree_location: "Tree locations", species: "Species", dbh: "Trunk diameter", tree_height: "Tree height",
  live_dead: "Live/dead", canopy_height: "Canopy height", crown_delineation: "Crowns", terrain: "Terrain",
  rgb_ortho: "Orthophoto", point_cloud_3d: "3D point cloud", biomass: "Biomass", fire_effects: "Fire effects",
  damage: "Damage", treatment_history: "Treatment history", disturbance_history: "Fire history",
};
const METRICS = {
  score:   { label: "Coverage score", lo: "little", hi: "rich" },
  count:   { label: "Record count",   lo: "1", hi: null },
  breadth: { label: "Kinds of data",  lo: "1", hi: "6" },
  recency: { label: "Most recent",    lo: "1950", hi: "2026" },
  frac:    { label: "Area covered",   lo: "0%", hi: "100%" },
};
// Sequential blue 100→700 (reference ramp); heat uses it, categorical kinds skip slot 1 so they never read as heat.
const RAMP = ["#cde2fb","#9ec5f4","#6da7ec","#3987e5","#256abf","#1c5cab","#104281","#0d366b"].map(hex);
const NOW = 2026;

const state = { metric: "score", kinds: new Set(Object.keys(KINDS)), caps: new Set(), minYear: 1950,
  commercial: false, showSim: true, selected: null };
const cache = {}; const geo = {}; let nearby = {}; let meta = null; let kindIdx = [], capIdx = [];
let cells = [], maxN = 1;

function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function kindColor(k) { return hex(css(`--k-${k}`)); }
function ramp(t) {
  t = Math.max(0, Math.min(1, t)) * (RAMP.length - 1);
  const i = Math.min(RAMP.length - 2, Math.floor(t)), f = t - i;
  return RAMP[i].map((c, j) => Math.round(c + (RAMP[i + 1][j] - c) * f));
}
function resForZoom(z) { return z < 6.3 ? 5 : z < 7.8 ? 6 : z < 9.2 ? 7 : 8; }
function capMask(set) { let m = 0; for (const c of set) m |= 1 << capIdx.indexOf(c); return m; }
function capsOf(mask) { return capIdx.filter((_, i) => mask & (1 << i)); }

function parseRows(j) {
  kindIdx = j.kinds; capIdx = j.caps;
  return j.rows.map(([h, k, n, frac, y0, y1, q, nobs, open, caps, sim]) =>
    ({ h, kind: j.kinds[k], n, frac: frac / 1000, y0, y1, q: q == null ? null : q / 100, nobs, open, caps, sim }));
}
function viewportTiles() {
  const b = map.getBounds(), pad = 0.3;
  const w = b.getWest() - pad, e = b.getEast() + pad, s = b.getSouth() - pad, n = b.getNorth() + pad;
  const ring = [[s, w], [s, e], [n, e], [n, w], [s, w]];
  const set = new Set(h3.polygonToCells(ring, meta.tile_res));
  set.add(h3.latLngToCell((s + n) / 2, (w + e) / 2, meta.tile_res));
  for (const t of [...set]) for (const nb of h3.gridDisk(t, 1)) set.add(nb);
  return [...set];
}
async function loadRes(res) {
  if (!meta.tiled_res.includes(res)) {
    if (!cache[res]) cache[res] = parseRows(await fetch(`data/coverage_r${res}.json`).then(r => r.json()));
    return cache[res];
  }
  cache[res] ??= {};
  const tiles = viewportTiles();
  await Promise.all(tiles.filter(t => !(t in cache[res])).map(t =>
    fetch(`data/coverage_r${res}/${t}.json`).then(r => r.ok ? r.json() : null).catch(() => null)
      .then(j => { cache[res][t] = j ? parseRows(j) : []; })));
  return tiles.flatMap(t => cache[res][t] || []);
}

function aggregate(rows) {
  const by = new Map();
  for (const r of rows) {
    if (!state.kinds.has(r.kind)) continue;
    if (r.y1 != null && r.y1 < state.minYear) continue;
    if (state.commercial && r.open === 0) continue;
    if (!state.showSim && r.sim) continue;
    let c = by.get(r.h);
    if (!c) by.set(r.h, c = { h: r.h, n: 0, kinds: [], fracMiss: 1, y1: null, caps: 0, score: 0, parts: [] });
    c.n += r.n; c.kinds.push(r.kind); c.parts.push(r);
    c.fracMiss *= 1 - r.frac; c.caps |= r.caps;
    c.y1 = Math.max(c.y1 ?? 0, r.y1 ?? 0) || null;
    // per kind: presence × recency (8-yr half-life) × quality, saturating with record count
    const rec = r.y1 ? Math.pow(0.5, Math.max(0, NOW - r.y1) / 8) : 0.3;
    c.score += KINDS[r.kind].weight * rec * (0.5 + 0.5 * (r.q ?? 0.6)) * Math.min(1, 0.6 + 0.2 * Math.log10(1 + r.n));
  }
  const need = capMask(state.caps);
  const out = [...by.values()].filter(c => (c.caps & need) === need);
  for (const c of out) c.frac = 1 - c.fracMiss;
  maxN = Math.max(1, ...out.map(c => c.n));
  return out;
}

function value(c) {
  switch (state.metric) {
    case "count": return Math.log10(1 + c.n) / Math.log10(1 + maxN);
    case "breadth": return (c.kinds.length - 1) / 5;
    case "recency": return c.y1 ? (c.y1 - 1950) / (NOW - 1950) : 0;
    case "frac": return Math.sqrt(c.frac);
    default: return Math.min(1, c.score / 2.2);
  }
}

// ---------- map ----------
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
const map = new maplibregl.Map({
  container: "map",
  style: `https://basemaps.cartocdn.com/gl/${dark ? "dark-matter" : "positron"}-gl-style/style.json`,
  center: [-119.6, 37.4], zoom: 5.4, minZoom: 4, maxZoom: 17,
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");
const overlay = new deck.MapboxOverlay({ interleaved: false, layers: [], getTooltip });
map.addControl(overlay);

async function render() {
  const z = map.getZoom(), res = resForZoom(z);
  cells = aggregate(await loadRes(res));
  const showFeat = z >= 9.5;
  const layers = [
    new deck.H3HexagonLayer({
      id: "coverage", data: cells, getHexagon: d => d.h, pickable: true, extruded: false,
      stroked: true, getLineColor: dark ? [26, 26, 25] : [252, 252, 251], lineWidthMinPixels: 0.5,
      getFillColor: d => [...ramp(value(d)), showFeat ? 60 : 165],
      updateTriggers: { getFillColor: [state.metric, showFeat, maxN] },
    }),
  ];
  if (showFeat) {
    for (const k of Object.keys(KINDS)) {
      if (!state.kinds.has(k) || !geo[k]) continue;
      const style = KINDS[k].style, col = kindColor(k);
      const keep = f => {
        const p = f.properties, y = +(p.date_end || p.date || "0").slice(0, 4);
        return (y >= state.minYear || !p.date) && (!state.commercial || p.allows_commercial)
          && (state.showSim || !p.simulated) && [...state.caps].every(c => (p.capabilities || []).includes(c));
      };
      layers.push(new deck.GeoJsonLayer({
        id: `feat-${k}`, data: geo[k].features.filter(keep), pickable: true,
        filled: style === "fill", stroked: true,
        // fuzzed points (FIA) are uncertainty envelopes, not footprints: faint fill so real footprints read on top
        getFillColor: f => [...col, f.properties.position_uncert_m > 500 ? 25 : 110],
        getLineColor: [...col, k === "spaceborne_lidar" ? 110 : 230],
        getLineWidth: style === "fill" ? 1 : k === "spaceborne_lidar" ? 1 : 2, lineWidthUnits: "pixels",
        ...(style === "dash" ? { extensions: [new deck.PathStyleExtension({ dash: true })], getDashArray: [4, 3] } : {}),
        getPointRadius: f => f.properties.position_uncert_m || 10, pointRadiusUnits: "meters", pointRadiusMinPixels: 3,
        highlightColor: [255, 255, 255, 80], autoHighlight: true,
        
      }));
    }
  }
  overlay.setProps({ layers, onClick });
  document.getElementById("status").textContent =
    `H3 res ${res} · ${cells.length.toLocaleString()} cells${showFeat ? " · footprints shown" : " · zoom in for footprints"}`;
}

function getTooltip({ object, layer }) {
  if (!object) return null;
  if (layer.id === "coverage") {
    const kinds = object.parts.map(p => `${KINDS[p.kind].label}: ${p.n}`).join("<br>");
    return { html: `<b>${object.n} records</b> · latest ${object.y1 ?? "?"}<br>${kinds}` };
  }
  const p = object.properties;
  return { html: `<b>${p.title}</b><br>${KINDS[p.data_kind].label} · ${p.date ?? "date unknown"}${p.simulated ? " · simulated" : ""}` };
}

function onClick({ object, layer }) {
  if (!object) return;
  if (layer.id === "coverage") showCell(object);
  else showRecord(object.properties.record_id);
}

// ---------- detail panel ----------
const panel = document.getElementById("panel"), body = document.getElementById("panel-body");
panel.querySelector(".close").onclick = () => panel.classList.remove("open");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function showCell(c) {
  const rows = c.parts.sort((a, b) => b.n - a.n).map(p => `<tr>
    <td><span class="sw ${KINDS[p.kind].style}" style="background:var(--k-${p.kind});border-color:var(--k-${p.kind})"></span>${KINDS[p.kind].label}${p.sim ? '<span class="sim">sim</span>' : ""}</td>
    <td>${p.n}</td><td>${p.y0 ?? "?"}–${p.y1 ?? "?"}</td><td>${p.q != null ? Math.round(p.q * 100) : "–"}</td></tr>`).join("");
  const [lat, lng] = h3ToLatLng(c.h);
  body.innerHTML = `<h3>${c.n} records in this cell</h3>
    <div class="muted">${c.kinds.length} kind${c.kinds.length > 1 ? "s" : ""} of data · ~${Math.round(c.frac * 100)}% of area has footprint coverage</div>
    <table class="kinds"><tr><th>Kind</th><th>Records</th><th>Years</th><th>Best quality</th></tr>${rows}</table>
    <h2>Measurable here</h2><div>${capsOf(c.caps).map(k => `<span class="tag">${CAP_LABELS[k] ?? k}</span>`).join("")}</div>
    <p><button class="chip" id="zoomcell">Zoom to footprints</button></p>`;
  document.getElementById("zoomcell").onclick = () => map.flyTo({ center: [lng, lat], zoom: Math.max(10.5, map.getZoom() + 2) });
  panel.classList.add("open");
}

function h3ToLatLng(h) { return h3.cellToLatLng(h); }

function findFeature(id) {
  for (const k in geo) { const f = geo[k].features.find(f => f.properties.record_id === id); if (f) return f; }
}
function bbox(f) {
  let x0 = 180, y0 = 90, x1 = -180, y1 = -90;
  const walk = a => typeof a[0] === "number" ? (x0 = Math.min(x0, a[0]), x1 = Math.max(x1, a[0]), y0 = Math.min(y0, a[1]), y1 = Math.max(y1, a[1])) : a.forEach(walk);
  walk(f.geometry.coordinates); return [[x0, y0], [x1, y1]];
}

function showRecord(id, fly = false) {
  const f = findFeature(id); if (!f) return;
  const p = f.properties;
  if (fly) map.fitBounds(bbox(f), { padding: 120, maxZoom: 16 });
  const near = (nearby[id] || []).map(([oid, rel, d, ov, gap]) => {
    const o = findFeature(oid)?.properties; if (!o) return "";
    const how = rel === "covered_by" || rel === "covers" ? `${rel.replace("_", " ")} · ${Math.round(ov * 100)}% overlap${gap != null ? ` · ${gap > 0 ? "+" : ""}${Math.round(gap / 365 * 10) / 10} yr` : ""}`
      : rel === "overlaps" ? `overlaps ${Math.round(ov * 100)}%` : `${(d / 1000).toFixed(1)} km away`;
    return `<li data-id="${esc(oid)}"><span class="sw ${KINDS[o.data_kind].style}" style="background:var(--k-${o.data_kind});border-color:var(--k-${o.data_kind})"></span>${esc(o.title)}<br><span class="muted">${how}</span></li>`;
  }).join("");
  body.innerHTML = `<h3>${esc(p.title)}</h3>
    <div class="muted">${KINDS[p.data_kind].label}${p.simulated ? ' <span class="sim">simulated</span>' : ""}</div>
    ${p.preview_url ? `<img src="${esc(p.preview_url)}" alt="Preview of ${esc(p.title)}" loading="lazy" onerror="this.remove()">` : ""}
    <dl>
      <dt>Date</dt><dd>${esc(p.date ?? "unknown")}${p.date_end && p.date_end !== p.date ? ` → ${esc(p.date_end)}` : ""}${p.time_precision && p.time_precision !== "day" ? ` <span class="muted">(${p.time_precision} only)</span>` : ""}</dd>
      <dt>Area</dt><dd>${p.area_ha?.toLocaleString()} ha</dd>
      <dt>Licence</dt><dd>${esc(p.license_id ?? "unknown")}${p.allows_commercial === false ? " · <b>non-commercial</b>" : ""}</dd>
      <dt>Credit</dt><dd>${esc(p.attribution ?? "–")}</dd>
      <dt>Quality</dt><dd>${p.quality_score != null ? Math.round(p.quality_score * 100) : "–"}${(p.quality_flags || []).map(f => ` <span class="tag">${esc(f)}</span>`).join("")}</dd>
      ${p.min_tree_dbh_cm != null ? `<dt>Min. tree DBH</dt><dd>${p.min_tree_dbh_cm} cm</dd>` : ""}
      ${p.min_tree_ht_m != null ? `<dt>Min. tree height</dt><dd>${p.min_tree_ht_m} m</dd>` : ""}
      ${p.spatial_res_m != null ? `<dt>Resolution</dt><dd>${p.spatial_res_m} m</dd>` : ""}
      ${p.position_uncert_m ? `<dt>Position ±</dt><dd>${p.position_uncert_m} m</dd>` : ""}
      ${p.n_observations ? `<dt>Observations</dt><dd>${p.n_observations.toLocaleString()}</dd>` : ""}
      <dt>ML test set</dt><dd>${p.withhold_from_training ? "yes – withheld from training" : "no"}</dd>
    </dl>
    <h2>Measures</h2><div>${(p.capabilities || []).map(k => `<span class="tag">${CAP_LABELS[k] ?? k}</span>`).join("")}</div>
    <h2>Nearby & overlapping (${(nearby[id] || []).length})</h2><ul class="near">${near || '<li class="muted">Nothing within 2 km</li>'}</ul>`;
  body.querySelectorAll(".near li[data-id]").forEach(li => li.onclick = () => showRecord(li.dataset.id, true));
  panel.classList.add("open");
}

// ---------- controls ----------
function buildControls() {
  const m = document.getElementById("metric");
  for (const [k, v] of Object.entries(METRICS)) {
    const b = document.createElement("button"); b.textContent = v.label; b.setAttribute("aria-pressed", k === state.metric);
    b.onclick = () => { state.metric = k; m.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); legend(); render(); };
    m.append(b);
  }
  const kd = document.getElementById("kinds");
  const counts = Object.fromEntries(Object.keys(KINDS).map(k => [k, geo[k]?.features.length ?? 0]));
  const simKinds = new Set(Object.keys(KINDS).filter(k => geo[k]?.features.every(f => f.properties.simulated)));
  for (const [k, v] of Object.entries(KINDS)) {
    const l = document.createElement("label"); l.className = "kind";
    l.innerHTML = `<input type="checkbox" checked><span><span class="sw ${v.style}" style="background:var(--k-${k});border-color:var(--k-${k})"></span>${v.label}${simKinds.has(k) && counts[k] ? '<span class="sim">sim</span>' : ""}</span><span class="count">${counts[k] ? counts[k].toLocaleString() : "no data"}</span>`;
    const cb = l.querySelector("input"); cb.disabled = !counts[k]; cb.checked = !!counts[k];
    if (!counts[k]) state.kinds.delete(k);
    cb.onchange = () => { cb.checked ? state.kinds.add(k) : state.kinds.delete(k); render(); };
    kd.append(l);
  }
  const cp = document.getElementById("caps");
  for (const [k, v] of Object.entries(CAP_LABELS)) {
    const b = document.createElement("button"); b.className = "chip"; b.textContent = v; b.setAttribute("aria-pressed", "false");
    b.onclick = () => { state.caps.has(k) ? state.caps.delete(k) : state.caps.add(k); b.setAttribute("aria-pressed", state.caps.has(k)); render(); };
    cp.append(b);
  }
  const yr = document.getElementById("year"), yv = document.getElementById("year-val");
  yr.value = state.minYear; yv.textContent = state.minYear;
  yr.oninput = () => { state.minYear = +yr.value; yv.textContent = yr.value; render(); };
  document.getElementById("commercial").onchange = e => { state.commercial = e.target.checked; render(); };
  document.getElementById("showsim").onchange = e => { state.showSim = e.target.checked; render(); };
  document.getElementById("footer").innerHTML = `Sources: ${meta.sources.map(s => `${s.source_id} (${s.n.toLocaleString()}${s.simulated ? ", simulated" : ""})`).join(", ")}. Built ${meta.built.slice(0, 10)}.<br>Each record keeps its own licence; credit the contributors listed on it.`;
  legend();
}

function legend() {
  document.getElementById("legend-bar").style.background = `linear-gradient(90deg, ${RAMP.map(c => `rgb(${c})`).join(",")})`;
  const m = METRICS[state.metric];
  document.getElementById("legend-lo").textContent = m.lo;
  document.getElementById("legend-hi").textContent = m.hi ?? `${maxN.toLocaleString()}`;
}

(async function init() {
  meta = await fetch("data/meta.json").then(r => r.json());
  const kinds = Object.keys(KINDS);
  const got = await Promise.all(kinds.map(k => fetch(`data/records_${k}.geojson`).then(r => r.ok ? r.json() : null).catch(() => null)));
  kinds.forEach((k, i) => { if (got[i]) geo[k] = got[i]; });
  nearby = await fetch("data/nearby.json").then(r => r.json());
  await loadRes(5);
  buildControls();
  map.on("load", render);
  let t; map.on("moveend", () => { clearTimeout(t); t = setTimeout(() => { render(); legend(); }, 80); });
  if (map.loaded()) render();
})();
</script>
</body>
</html>
